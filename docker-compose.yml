services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: schoolapp
      POSTGRES_PASSWORD: schoolapp
      POSTGRES_DB: schoolapp
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schoolapp -d schoolapp"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://schoolapp:schoolapp@db:5432/schoolapp
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
      # From .env, which is gitignored. Compose refuses to start without them.
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env, see .env.example}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env, see .env.example}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_HOURS: ${SESSION_HOURS:-12}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    # Python is interpreted, so mounting the source means an edit needs a
    # restart at most, never an image rebuild. The image still carries a full
    # copy, so this stays deployable with the mounts removed.
    volumes:
      - ./backend/app:/srv/app
      - ./backend/tests:/srv/tests
    # Pairs with the mounts above. The image's own CMD has no reload, so this
    # stays a local convenience rather than something that ships.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)\""]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  pgdata:
